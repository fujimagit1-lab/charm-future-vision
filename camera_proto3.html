    b.style.width = (h.line.w * 100) + "%"; b.style.height = (h.line.h * 100) + "%";
    const sp = document.createElement("span"); sp.textContent = h.cands[0].sk.name + (h.lv ? " Lv" + h.lv : "");
    b.appendChild(sp); wrap.appendChild(b);
  }
}
function renderResults(hits, rare, icons, slotCands, slotInfo) {
  window.__hits = hits;
  if (icons !== undefined) window.__last = { rare, icons, slotCands, slotInfo };
  $("rare").innerHTML = rare ? "<b>レア度: RARE " + rare + "</b>" : "<span class='warn'>レア度は読めませんでした</span>";
  let sh = "<b>スロット: </b>";
  if (!icons) sh += "<span class='warn'>未検出（スロット行が見つかりませんでした）</span>";
  else if (!icons.length) sh += "<span class='warn'>未検出（アイコンが見つかりませんでした）</span>";
  else if (slotCands && slotCands.length === 1) sh += "<b>" + slotCands[0].join("-") + "</b> <span class='sim'>（" + slotInfo + "）</span>";
  else if (slotCands && slotCands.length > 1) sh += "候補 " + slotCands.map(p => "<span class='chip'>" + p.join("-") + "</span>").join("") + " <span class='sim'>（" + slotInfo + "）</span>";
  else sh += "<span class='warn'>パターンと一致しませんでした</span> <span class='sim'>（" + slotInfo + "）</span>";
  $("slotres").innerHTML = sh;
  const main = hits.filter(h => h.lv != null);
  const ref = hits.filter(h => h.lv == null);
  let hh = "<div style='margin-top:10px'><b>スキル候補（Lvあり）</b></div>";
  if (!main.length) hh += "<div class='warn'>Lv付きのスキル行は見つかりませんでした</div>";
  main.forEach((h) => {
    const gi = hits.indexOf(h);
    hh += "<div class='hit'><b class='selname'>" + h.cands[0].sk.name + "</b> <b>Lv" + h.lv + "</b>";
    if (h.pips != null) hh += " <span class='sim'>■カウント: " + h.pips + (h.pips === h.lv ? "（一致）" : "（<span class='warn'>不一致</span>）") + "</span>";
    else hh += " <span class='sim'>■カウント: ?</span>";
    if (h.filtered) hh += " <span class='sim'>Lv" + h.lv + "で出ない候補を除外済み</span>";
    hh += "<div>" + h.cands.map((c, ci) => "<span class='chip" + (ci === 0 ? " sel" : "") + "' onclick='pick(" + gi + "," + ci + ")'>" + c.sk.name + " <span class='sim'>" + Math.round(c.s * 100) + "%</span></span>").join("") + "</div></div>";
  });
  $("hits").innerHTML = hh;
  let rh = "";
  if (ref.length) {
    rh = "<div style='margin-top:10px'><b>参考（Lvなし・ステータス欄などの可能性）</b></div>" + ref.map(h => "<div class='hit'><span class='selname'>" + h.cands[0].sk.name + "</span> <span class='sim'>" + Math.round(h.cands[0].s * 100) + "%</span></div>").join("");
  }
  $("refhits").innerHTML = rh;
  $("result").style.display = "block";
}
function pick(gi, ci) {
  const h = window.__hits[gi];
  const c = h.cands[ci]; h.cands.splice(ci, 1); h.cands.unshift(c);
  const L = window.__last || {};
  renderResults(window.__hits, L.rare, L.icons, L.slotCands, L.slotInfo);
}
</script>
