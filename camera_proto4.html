  const t0 = performance.now();
  $("go").disabled = true;
  $("result").style.display = "none"; $("rawpanel").style.display = "none";
  $("prog").textContent = "準備中…";
  const { cv, ctx, W, H } = frameCanvas();
  const colData = ctx.getImageData(0, 0, W, H).data;
  let worker;
  try { worker = await getWorker(); }
  catch (e) { $("prog").textContent = "OCRの初期化に失敗しました: " + e.message; $("go").disabled = false; return; }
  const raws = [];
  const rareText = await ocrRegion(worker, cv, REG.rare, { whitelist: "RARE0123456789 ", minH: 80 });
  raws.push("RARE範囲: " + rareText.trim());
  const rareM = rareText.match(/(\d)/);
  const rare = rareM ? +rareM[1] : null;
  const icons = analyzeSlotBox(colData, W, H, REG.slot);
  const slotCands = icons && icons.length ? narrowSlots(rare, icons.map(ic => ic.tri)) : null;
  const slotInfo = icons ? "アイコン" + icons.length + "個／三角形: " + icons.map(ic => ic.tri == null ? "?" : ic.tri).join(", ") : "";
  const hits = [];
  for (let i = 0; i < 3; i++) {
    $("prog").textContent = "スキル" + (i + 1) + "行を読み取り中…";
    const ry = REG.rowsY[i];
    const nameR = { x: REG.nameIn.x, y: ry + REG.rowH * REG.nameIn.y, w: REG.nameIn.w, h: REG.rowH * REG.nameIn.h };
    const lvR = { x: REG.lvIn.x, y: ry + REG.rowH * REG.lvIn.y, w: REG.lvIn.w, h: REG.rowH * REG.lvIn.h };
    const pipR = { x: REG.pipIn.x, y: ry + REG.rowH * REG.pipIn.y, w: REG.pipIn.w, h: REG.rowH * REG.pipIn.h };
    const nameText = await ocrRegion(worker, cv, nameR, { minH: 100 });
    const lvText = await ocrRegion(worker, cv, lvR, { whitelist: "Lv0123456789", minH: 80 });
    raws.push("行" + (i + 1) + " 名前: " + nameText.trim() + " ／ Lv: " + lvText.trim());
    const cands = skillCandidates(nameText);
    const lvM = lvText.replace(/\s/g, "").match(/(\d)/);
    const lvT = lvM ? +lvM[1] : null;
    const pips = countPipsIn(colData, W, H, pipR);
    let lv = lvT, lvSrc = lvT != null ? "テキスト" : null;
    if (lv == null && pips != null) { lv = pips; lvSrc = "■"; }
    let filtered = false;
    if (cands.length && lv != null) {
      const valid = cands.filter(c => c.sk.levels.includes(lv));
      if (valid.length && valid.length < cands.length) { cands.splice(0, cands.length, ...valid); filtered = true; }
    }
    hits.push({ cands, lv, lvT, pips, lvSrc, filtered, row: i });
  }
  $("prog").textContent = "読み取り完了（" + Math.round(performance.now() - t0) + "ms）";
  $("raw").textContent = raws.join("\n");
  $("rawpanel").style.display = "block";
  window.__last = { rare, icons, slotCands, slotInfo };
  renderResults(hits);
  $("go").disabled = false;
}
function renderResults(hits) {
  window.__hits = hits;
  const L = window.__last || {};
  $("rare").innerHTML = L.rare ? "<b>レア度: RARE " + L.rare + "</b>" : "<span class='warn'>レア度は読めませんでした</span>";
  let sh = "<b>スロット: </b>";
  if (!L.icons || !L.icons.length) sh += "<span class='warn'>未検出（アイコンが見つかりませんでした）</span>";
  else if (L.slotCands && L.slotCands.length === 1) sh += "<b>" + L.slotCands[0].join("-") + "</b> <span class='sim'>（" + L.slotInfo + "）</span>";
  else if (L.slotCands && L.slotCands.length > 1) sh += "候補 " + L.slotCands.map(p => "<span class='chip'>" + p.join("-") + "</span>").join("") + " <span class='sim'>（" + L.slotInfo + "）</span>";
  else sh += "<span class='warn'>パターンと一致しませんでした</span> <span class='sim'>（" + L.slotInfo + "）</span>";
  $("slotres").innerHTML = sh;
  let hh = "<div style='margin-top:10px'><b>スキル</b></div>";
  hits.forEach((h, gi) => {
    if (!h.cands.length) { hh += "<div class='hit'><span class='sim'>行" + (h.row + 1) + ": スキルなし／読めませんでした</span></div>"; return; }
    hh += "<div class='hit'><b>" + h.cands[0].sk.name + "</b>";
    if (h.lv != null) hh += " <b>Lv" + h.lv + "</b> <span class='sim'>（" + h.lvSrc + "）</span>";
    else hh += " <span class='warn'>Lv不明</span>";
    if (h.lvT != null && h.pips != null && h.lvT !== h.pips) hh += " <span class='warn'>■は" + h.pips + "で不一致</span>";
    else if (h.pips != null && h.lvT != null) hh += " <span class='sim'>■" + h.pips + "と一致</span>";
    if (h.filtered) hh += " <span class='sim'>Lvで出ない候補を除外済み</span>";
    hh += "<div>" + h.cands.map((c, ci) => "<span class='chip" + (ci === 0 ? " sel" : "") + "' onclick='pick(" + gi + "," + ci + ")'>" + c.sk.name + " <span class='sim'>" + Math.round(c.s * 100) + "%</span></span>").join("") + "</div></div>";
  });
  $("hits").innerHTML = hh;
  $("result").style.display = "block";
}
function pick(gi, ci) {
  const h = window.__hits[gi];
  const c = h.cands[ci]; h.cands.splice(ci, 1); h.cands.unshift(c);
  renderResults(window.__hits);
}
</script>
</body>
